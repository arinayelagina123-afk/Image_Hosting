version: '3.9'
services:
  app:
    build: .
    container_name: image-server-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      IMAGE_DIR: /images
      LOGS_DIR: /logs

    volumes:
      - ./images:/images
      - ./logs:/logs

  nginx:
    image: nginx:1.27-alpine
    container_name: image_server_nginx
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/images:ro
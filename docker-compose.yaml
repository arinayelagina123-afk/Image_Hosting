version: '3.9'
services:
  app:
    build: .
    container_name: image-server-app
    restart: unless-stopped

    depends_on:
      - db

    ports:
      - "8000:8000"

    environment:
      IMAGES_DIR: /images
      LOGS_DIR: /logs
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: images_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    volumes:
      - ./images:/images
      - ./logs:/logs
  db:
    image: postgres:15
    container_name: image_serverdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: images_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5435:5432
  nginx:
    image: nginx:1.27-alpine
    container_name: image_server_nginx
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "8080:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images:/images:ro
  backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: image_server_backup
    restart: unless-stopped

    depends_on:
      - db

    environment:
      PGPASSWORD: password

    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/crontab:/etc/cron.d/db-backup:ro

volumes:
  db_data:
